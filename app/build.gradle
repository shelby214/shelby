plugins {
    id "com.android.application"
}

android {
    namespace "com.samarth.ytcleanplayer"
    compileSdk 36

    defaultConfig {
        applicationId "com.samarth.ytcleanplayer"
        minSdk 36
        targetSdk 36
        versionCode 31
        versionName "1.9.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
